<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS AI</title>
    <!-- Include Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card-bg: rgba(26, 29, 38, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --screen-accent: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --status-green: #10b981;
            --status-amber: #f59e0b;
            --status-red: #ef4444;
            --user-bubble: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

            .icon-btn:hover {
                background: rgba(255, 255, 255, 0.1);
                color: var(--text-main);
            }

            .icon-btn.active {
                background: var(--accent);
                color: white;
                border-color: var(--accent);
            }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        .visualizer {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 14px;
        }

        .bar {
            width: 3px;
            background-color: var(--status-green);
            border-radius: 2px;
            height: 3px;
            transition: height 0.05s ease, background-color 0.2s;
        }

        .wake-pill {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

            .wake-pill span {
                color: #818cf8;
                font-weight: 600;
            }

        /* Chat History Stream Container */
        .chat-container {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(10px);
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-user {
            background: var(--user-bubble);
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-assistant {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

            /* Markdown Styles within Assistant Bubble */
            .msg-assistant p {
                margin-bottom: 8px;
            }

                .msg-assistant p:last-child {
                    margin-bottom: 0;
                }

            .msg-assistant code {
                background: rgba(0,0,0,0.3);
                padding: 2px 4px;
                border-radius: 4px;
                font-family: monospace;
            }

            .msg-assistant pre {
                background: rgba(0,0,0,0.5);
                padding: 10px;
                border-radius: 6px;
                overflow-x: auto;
                margin: 8px 0;
            }

            .msg-assistant ul, .msg-assistant ol {
                margin-left: 20px;
                margin-bottom: 8px;
            }

        .cursor {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: var(--accent);
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .input-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .preview-container {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 8px;
        }

            .preview-container img {
                height: 40px;
                border-radius: 4px;
                border: 1px solid var(--border);
            }

        .preview-text {
            font-size: 12px;
            color: var(--screen-accent);
        }

        .input-box {
            width: 100%;
            background: rgba(15, 17, 23, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

            .input-box:focus {
                border-color: var(--accent);
            }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto auto;
            gap: 8px;
        }

        .btn {
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            color: #fff;
        }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .btn-screen {
            background: linear-gradient(135deg, #0891b2, #0284c7);
        }

            .btn-screen:hover:not(:disabled) {
                filter: brightness(1.1);
            }

        .btn-chat {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }

            .btn-chat:hover:not(:disabled) {
                filter: brightness(1.1);
            }

        .btn-mic {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            width: 44px;
            padding: 0;
            font-size: 16px;
        }

            .btn-mic:hover:not(:disabled) {
                background: rgba(255, 255, 255, 0.15);
            }

        .btn-stop {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--status-red);
            color: var(--status-red);
            width: 44px;
            padding: 0;
        }

            .btn-stop:hover:not(:disabled) {
                background: rgba(239, 68, 68, 0.4);
                color: white;
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-group">
                <div class="title">ATLAS System</div>
                <div class="status-badge">
                    <div class="visualizer" id="audioVisualizer">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                    <span id="statusText" style="font-weight: 600;">Ready</span>
                </div>
            </div>
            <div class="header-controls">
                <button class="icon-btn" id="btnPin" onclick="togglePin()" title="Toggle Always on Top">📌</button>
                <button class="icon-btn" onclick="clearChat()" title="Clear Conversation">🧹 Clear</button>
            </div>
        </div>

        <div class="wake-pill">
            Wake word active: <span>"Atlas"</span> or <span>"Atlas, Explain Screen"</span>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message msg-assistant">
                <p>System initialized. Type a query, use the buttons below, or say "Atlas" to begin.</p>
            </div>
        </div>

        <div class="input-card">
            <div class="preview-container" id="previewContainer">
                <img id="previewImg" src="" alt="Screen Capture">
                <span class="preview-text">Screen captured</span>
            </div>
            <input type="text" id="mainInput" class="input-box" placeholder="Ask about your screen or type a question..." onkeypress="handleEnter(event)">
            <div class="btn-grid">
                <button class="btn btn-screen" id="btnScreen" onclick="handleScreenAsk()">🖥️ Ask Screen</button>
                <button class="btn btn-chat" id="btnChat" onclick="handleNormalAsk()">💬 Chat</button>
                <button class="btn btn-mic" id="btnMic" title="Voice Input" onclick="handleDirectVoice()">🎙️</button>
                <button class="btn btn-stop" id="btnStop" title="Stop Audio" onclick="handleStopAudio()">⏹️</button>
            </div>
        </div>
    </div>

    <script>
        let currentAssistantBubble = null;
        let currentRawText = "";
        let isPinned = false;

        function setStatus(text, textColor = "#10b981", disableButtons = false) {
        const statusNode = document.getElementById('statusText');
        statusNode.innerText = text;
        statusNode.style.color = textColor;

        document.getElementById('btnScreen').disabled = disableButtons;
        document.getElementById('btnChat').disabled = disableButtons;
        document.getElementById('btnMic').disabled = disableButtons;
        }

        function scrollToBottom() {
        const chat = document.getElementById('chatContainer');
        chat.scrollTop = chat.scrollHeight;
        }

        window.addUserBubble = function(text) {
        const chat = document.getElementById('chatContainer');
        const bubble = document.createElement('div');
        bubble.className = 'message msg-user';
        bubble.innerText = text;
        chat.appendChild(bubble);
        scrollToBottom();
        };

        window.createNewAssistantBubble = function() {
        const chat = document.getElementById('chatContainer');
        currentAssistantBubble = document.createElement('div');
        currentAssistantBubble.className = 'message msg-assistant';
        currentAssistantBubble.innerHTML = '<span class="cursor"></span>';
        chat.appendChild(currentAssistantBubble);
        currentRawText = "";
        scrollToBottom();
        };

        window.appendChunk = function(text) {
        if (!currentAssistantBubble) window.createNewAssistantBubble();
        currentRawText += text;

        // While streaming, display raw text to prevent markdown parsing glitches on partial tags
        currentAssistantBubble.innerHTML = currentRawText.replace(/\n/g, '<br>') + '<span class="cursor"></span>';
        scrollToBottom();
        };

        window.finalizeResponse = function() {
        if (currentAssistantBubble) {
        // Parse markdown once generation is complete
        currentAssistantBubble.innerHTML = marked.parse(currentRawText);
        currentAssistantBubble = null;
        currentRawText = "";
        }
        scrollToBottom();
        };

        window.updateInputBox = function(val) {
        document.getElementById('mainInput').value = val;
        };

        window.showImagePreview = function(base64Data) {
        const container = document.getElementById('previewContainer');
        const img = document.getElementById('previewImg');
        img.src = base64Data;
        container.style.display = 'flex';

        // Auto hide after 5 seconds
        setTimeout(() => {
        container.style.display = 'none';
        img.src = '';
        }, 5000);
        };

        window.wipeChatUI = function() {
        document.getElementById('chatContainer').innerHTML = `
        <div class="message msg-assistant">
        <p>Conversation cleared. Memory reset.</p>
        </div>`;
        };

        async function handleScreenAsk() {
        const input = document.getElementById('mainInput');
        const question = input.value.trim() || "Explain what is on the screen.";
        window.addUserBubble("🖥️ [Screen Request]: " + question);
        input.value = "";

        setStatus("Capturing & Thinking...", "#06b6d4", true);
        await pywebview.api.ask_with_screen(question);
        setStatus("Ready", "#10b981", false);
        }

        async function handleNormalAsk() {
        const input = document.getElementById('mainInput');
        const question = input.value.trim();
        if (!question) return;

        window.addUserBubble(question);
        input.value = "";

        setStatus("Thinking...", "#f59e0b", true);
        await pywebview.api.ask_text_only(question);
        setStatus("Ready", "#10b981", false);
        }

        function handleEnter(e) {
        if (e.key === 'Enter') handleNormalAsk();
        }

        async function handleDirectVoice() {
        setStatus("Listening...", "#ef4444", true);
        await pywebview.api.trigger_manual_voice();
        }

        async function handleStopAudio() {
        await pywebview.api.stop_audio();
        setStatus("Ready", "#10b981", false);
        }

        
        async function togglePin() {
            const btn = document.getElementById('btnPin');
        
            try {
                const requestedState = !isPinned;
                const success = await pywebview.api.toggle_pin(requestedState);
        
                if (success) {
                    isPinned = requestedState;
                } else {
                    isPinned = false;
                    console.error("Windows could not confirm the requested pin state.");
                }
        
                btn.classList.toggle('active', isPinned);
            } catch (error) {
                console.error("Always-on-top error:", error);
            }
        }


        async function clearChat() {
        await pywebview.api.clear_chat();
        window.wipeChatUI();
        }

        // --- Hardware-Driven Audio Visualizer ---
        async function initMicVisualizer() {
        try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const bars = document.querySelectorAll('.bar');

        function updateBars() {
        analyser.getByteFrequencyData(dataArray);
        const indexes = [2, 4, 6, 8, 10];
        for (let i = 0; i < bars.length; i++) {
        const val = dataArray[indexes[i]];
        const height = 3 + (val / 255) * 11;
        bars[i].style.height = height + 'px';

        if (val > 180) bars[i].style.backgroundColor = 'var(--status-red)';
        else if (val > 100) bars[i].style.backgroundColor = 'var(--status-amber)';
        else bars[i].style.backgroundColor = 'var(--status-green)';
        }
        requestAnimationFrame(updateBars);
        }
        updateBars();
        } catch (err) {
        console.error("Microphone access denied.", err);
        }
        }

        window.addEventListener('load', initMicVisualizer);
    </script>
</body>
</html>
